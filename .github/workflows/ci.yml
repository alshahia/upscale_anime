name: CI

on:
  push:
    branches: [main, develop, "release/**", "refactor/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.12 and the dependency floors (torch>=2.12,
        # torchvision>=0.27) only resolve on 3.12+; a 3.10/3.11 leg can never
        # pass. One leg keeps the signal honest.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install ffmpeg (PyAV test inputs)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install OpenCV runtime libraries
        # `libglib2.0-6` does not exist; Ubuntu 26.04 ships libglib2.0-0t64
        # (the pre-t64 name is a fallback for older runner images).
        run: |
          sudo apt-get install -y libgl1
          sudo apt-get install -y libglib2.0-0t64 || sudo apt-get install -y libglib2.0-0

      - name: Install PyTorch (CPU wheel)
        # The PyPI default is the CUDA-bundled wheel (~2.5 GB). Pull the CPU
        # wheel first so `pip install -e .` sees the requirement satisfied.
        run: |
          pip install \
            torch==2.12.0 torchvision==0.27.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"

      - name: Verify install
        run: |
          python -c "import anime_sr; print(anime_sr.__version__)"
          anime-sr --help

      - name: Lint (blocking - syntax errors only)
        # Only E9 (syntax errors) blocks a push. F63/F7/F82 and the style
        # backlog are Track 2 Task 27 work; they stay visible in the advisory
        # lint runs below instead of failing every lane.
        run: flake8 . --select=E9 --exclude=.venv,data,runs

      - name: Lint (advisory - full style backlog)
        # Advisory: the ~17 F821 undefined names and the style backlog are
        # Track 2 Task 27 work. Keep visible; do not block pushes.
        continue-on-error: true
        run: flake8 . --count --statistics

      - name: Type check (advisory)
        # Advisory: the mypy backlog is Track 2 Task 27 work. Keep visible;
        # do not block pushes.
        continue-on-error: true
        run: mypy src/anime_sr

      - name: Unit + integration tests with coverage (advisory)
        # Advisory: the pre-existing failures in the root suite are Track 2
        # Task 27 work. Keep visible; do not block pushes.
        continue-on-error: true
        run: |
          pytest tests \
            --cov=anime_sr \
            --cov-report=xml \
            --cov-report=term \
            -q

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  gui-tests:
    name: GUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install system dependencies
        # tkinter + a virtual display: Tk aborts without $DISPLAY on Linux.
        # ffmpeg/ffprobe are GUI runtime requirements (video muxing and the
        # --self-check report); libglib2.0-6 does not exist on Ubuntu 26.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg libgl1
          sudo apt-get install -y libglib2.0-0t64 || sudo apt-get install -y libglib2.0-0

      - name: Install PyTorch (CPU wheel)
        run: |
          pip install \
            torch==2.12.0 torchvision==0.27.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Install GUI dependencies
        # There is no [gui] extra; the GUI declares its own dependency floors
        # (torch>=2.12, torchvision>=0.27) in requirements.txt.
        run: pip install -r apps/anime_upscaler_gui/requirements.txt

      - name: GUI + release test suite
        # tests/release builds both wheels and checks the vendored-model
        # closure, the preset catalog and the deprecated-packager guard.
        run: xvfb-run -a python -m pytest apps/anime_upscaler_gui/tests tests/release -q

  api-smoke:
    name: API smoke (app factory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package with API extras
        run: pip install -e ".[api]"

      - name: Import API module and build the app
        # Catches broken imports in the FastAPI factory (e.g. a missing
        # create_app) without needing a model checkpoint.
        run: |
          python - <<'PY'
          from anime_sr.api.inference_api import create_app
          app = create_app({"api": {"api_key": "smoke-test"}})
          routes = {r.path for r in app.routes}
          assert "/health" in routes, f"health route missing: {sorted(routes)}"
          print("API app OK:", routes)
          PY

  integration-test:
    name: Integration (model load + end-to-end)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
          sudo apt-get install -y libglib2.0-0t64 || sudo apt-get install -y libglib2.0-0

      - name: Install PyTorch (CPU wheel)
        run: |
          pip install \
            torch==2.12.0 torchvision==0.27.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Validate all config files
        # Every YAML under configs/ must parse; the loader and --dry-run paths
        # are exercised by the unit-test job, this catches broken YAML itself.
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          bad = []
          configs = sorted(Path("configs").rglob("*.yaml"))
          for path in configs:
              try:
                  data = yaml.safe_load(path.read_text())
              except Exception as e:  # noqa: BLE001 - report every parse failure
                  bad.append(f"{path}: {e}")
                  continue
              if data is None:
                  continue  # intentionally empty placeholder config
              if not isinstance(data, dict):
                  bad.append(f"{path}: top level is {type(data).__name__}, expected mapping")
          print(f"validated {len(configs)} config files")
          if bad:
              raise SystemExit("invalid YAML:\n" + "\n".join(bad))
          PY

      - name: Generate a synthetic SPAN checkpoint
        # Real checkpoints are multi-GB artifacts that never belong in CI; a
        # freshly initialised model exercises the same load/save/infer paths.
        run: |
          mkdir -p checkpoints/span
          python - <<'PY'
          import torch
          from anime_sr.models.span import create_span_model

          model = create_span_model({})
          state = {"model_state_dict": model.state_dict()}
          torch.save(state, "checkpoints/span/spanx4_ch48.pth")
          print("saved synthetic checkpoint")
          PY

      - name: Generate test data
        run: python scripts/create_test_data.py --output data/test_hr --num-images 2

      - name: Run inference (single image)
        run: |
          python scripts/inference.py \
            --checkpoint checkpoints/span/spanx4_ch48.pth \
            --input data/test_hr \
            --output output/infer_smoke/sr \
            --device cpu \
            --model-type span
          test -n "$(find output/infer_smoke/sr -name '*.png' | head -1)"

      - name: Run inference (metrics)
        run: |
          python scripts/inference.py \
            --checkpoint checkpoints/span/spanx4_ch48.pth \
            --input data/test_hr \
            --output output/infer_smoke/sr_metrics \
            --gt data/test_hr \
            --metrics \
            --device cpu \
            --model-type span

      - name: Verify CLI entry point
        # The infer CLI treats --output as a directory and writes
        # <input-stem>_sr<ext> inside it (see _handle_infer in
        # src/anime_sr/__main__.py), so assert the produced file there.
        run: |
          anime-sr infer --checkpoint checkpoints/span/spanx4_ch48.pth \
            --input data/test_hr/dummy_0000.png \
            --output output/cli_smoke \
            --device cpu
          test -f output/cli_smoke/dummy_0000_sr.png

      - name: Upload integration outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-outputs
          path: output/
          if-no-files-found: warn

  performance-test:
    name: Performance benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install PyTorch (CPU wheel)
        run: |
          pip install \
            torch==2.12.0 torchvision==0.27.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Generate synthetic checkpoint and data
        run: |
          mkdir -p checkpoints/span
          python - <<'PY'
          import torch
          from anime_sr.models.span import create_span_model
          model = create_span_model({})
          torch.save({"model_state_dict": model.state_dict()},
                     "checkpoints/span/spanx4_ch48.pth")
          PY
          python scripts/create_test_data.py --output data/test_hr --num-images 2
          mkdir -p data/test_lr
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for src in Path("data/test_hr").glob("*.png"):
              img = Image.open(src)
              img.resize((img.width // 4, img.height // 4)).save(
                  Path("data/test_lr") / src.name)
          print("lr ready")
          PY

      - name: Run benchmark (CPU)
        run: |
          python scripts/benchmark_model.py \
            --checkpoint checkpoints/span/spanx4_ch48.pth \
            --lr-dir data/test_lr \
            --hr-dir data/test_hr \
            --output benchmark_results.json \
            --device cpu
          test -f benchmark_results.json

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          if-no-files-found: warn

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit~=1.7.0

      - name: Run bandit
        # Report everything from MEDIUM severity up; a finding fails the lane.
        run: |
          bandit -r src/ -ll -f json -o bandit-report.json || true
          bandit -r src/ -ll -f txt
          test ! -s bandit-report.json || python - <<'PY'
          import json, sys
          report = json.load(open("bandit-report.json"))
          results = report.get("results", [])
          if results:
              print(f"{len(results)} bandit findings at MEDIUM+ severity")
              sys.exit(1)
          print("no MEDIUM+ findings")
          PY

      - name: Upload bandit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload docs site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          if-no-files-found: warn

  deployment:
    name: Deploy
    runs-on: ubuntu-latest
    # Only reachable from a version tag, and only once every gate is green.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, gui-tests, api-smoke, integration-test, performance-test, security, build-docs]
    env:
      # The `secrets` context is not allowed inside `if:` (GitHub rejects the
      # whole workflow at compile time), so publish state is expressed through
      # job-level env and checked with the `env` context on the step below.
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

      - name: Deploy to PyPI
        # Dry-run until TWINE_PASSWORD is configured in repo secrets.
        if: ${{ env.TWINE_PASSWORD != '' }}
        run: twine upload dist/*
