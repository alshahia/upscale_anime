[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-sr"
version = "0.1.0"
description = "Anime Super-Resolution with Progressive Ensemble Distillation (SPAN, Mamba-PAN)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Anime SR Team", email = "anime-sr@example.com"},
]
keywords = ["super-resolution", "anime", "pytorch", "span", "mamba-pan", "distillation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.12"
dependencies = [
    "torch~=2.4.0",
    "torchvision~=0.19.0",
    "numpy~=1.26.0",
    "opencv-python~=4.9.0",
    "Pillow~=10.2.0",
    "PyYAML~=6.0",
    "tqdm~=4.65.0",
    "tensorboard~=2.13.0",
    "imageio~=2.31.0",
    "imageio-ffmpeg~=0.4.8",
    "scikit-image~=0.22.0",
    "av~=17.0",
    "pillow-heif~=1.4",
    "PyWavelets~=1.4.0",
    "lpips~=0.1.4",
    "pyiqa~=0.1.15",
    "matplotlib~=3.7.0",
    "einops~=0.7.0",
    "timm~=0.9.0",
    "psutil~=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4.0",
    "pytest-cov~=4.1.0",
    "pytest-timeout~=2.2.0",
    "coverage~=7.4.0",
    "black~=23.0.0",
    "flake8~=6.0.0",
    "mypy~=1.8.0",
    "bandit~=1.7.0",
    "build~=1.0.0",
    "twine~=5.0.0",
]
api = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
]
mamba = [
    "mamba-ssm>=1.1.0",
    "causal-conv1d>=1.1.0",
]

[project.scripts]
anime-sr = "anime_sr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/anime_upscaler_gui/tests"]
# Make `apps` importable no matter how pytest is launched (root or package dir).
pythonpath = [".", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (multi-component)",
    "e2e: marks tests as end-to-end tests (full pipeline)",
    "gui: marks tests as GUI tests",
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: marks tests that require GPU",
    "mamba: marks tests that require mamba-ssm",
    "runslow: opt-in long-running tests (enable with --runslow or -m runslow)",
    "requires_data: tests that need local datasets or checkpoints",
    "requires_teachers: tests that need detached teacher-model checkpoints",
]
filterwarnings = [
    # Third-party noise only - project code must not rely on blanket suppression.
    "ignore:.*torch.meshgrid.*:UserWarning",
    "ignore:.*pynvml.*:UserWarning",
    "default",
]

[tool.coverage.run]
source = ["anime_sr"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "scripts/",
    "apps/",
]
